<body>
<div id="stage"></div>
<script>
/* Un visuel par chargement : render.html#theme=psephide&kind=poster&id=zeugma */
(async function () {
  var q = new URLSearchParams(location.hash.slice(1));
  var theme = q.get('theme'), kind = q.get('kind'), id = q.get('id');
  var SIZES = { poster: [1080, 1350], cover: [1640, 924], profile: [1080, 1080], logo: [1600, 1600] };
  var WH = SIZES[kind], stage = document.getElementById('stage');
  stage.style.width = WH[0] + 'px'; stage.style.height = WH[1] + 'px';
  try {
    await new Promise(function (ok, ko) {
      var s = document.createElement('script');
      s.src = 'themes/' + theme + '.js'; s.onload = ok; s.onerror = function () { ko(new Error('thème ' + theme)); };
      document.head.appendChild(s);
    });
    var T = window.THEMES[theme];
    await Promise.all((T.fonts || []).map(function (f) { return document.fonts.load(f, 'AΩαω Éé'); }));
    await document.fonts.ready;
    await T.render(stage, { W: WH[0], H: WH[1], kind: kind, ed: id ? STUDIO.byId[id] : null, theme: T });
    window.__done = 'ok';
  } catch (e) { window.__done = 'error: ' + (e && e.stack || e); }
})();
</script>
